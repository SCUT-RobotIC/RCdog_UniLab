# @package _global_
# RC27Dog broken-bridge owner.  Groove boxes are part of the scene model and
# share the same 0.55 m period used by obstacle terms in the source task.
defaults:
  - /task/rc27dog_flat/base
  - _self_

env:
  scene:
    model_file: src/unilab/assets/robots/rc27dog/scene_broken_bridge.xml
  max_episode_seconds: 20.0
  commands:
    twist:
      _target_: unilab.tasks.locomotion.rc27dog.manager_terms.BrokenBridgeVelocityCommandCfg
      entity_name: robot
      resampling_time_range: [5.0, 15.0]
      heading_command: false
      heading_control_stiffness: 0.5
      rel_standing_envs: 0.05
      rel_heading_envs: 0.0
      rel_world_envs: 0.0
      forward_only_prob: 0.70
      turn_in_place_prob: 0.25
      standing_prob: 0.05
      min_turn_abs_ang_vel_z: 0.2
      ranges:
        lin_vel_x: [0.25, 0.65]
        lin_vel_y: [0.0, 0.0]
        ang_vel_z: [-0.5, 0.5]
        heading: null

reward:
  progress:
    func: unilab.tasks.locomotion.rc27dog.manager_terms.ObstacleReward
    weight: 2.0
    params:
      kind: broken_bridge_progress
      start_x: -0.2
      finish_x: 3.5


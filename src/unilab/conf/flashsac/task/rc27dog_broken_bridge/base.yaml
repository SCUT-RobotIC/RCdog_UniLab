# @package _global_
# Standalone broken-bridge task for the 27dog wheel-legged robot (16 DoF: 12 revolute
# leg joints + 4 continuous wheel joints named *_feet_joint).
#
# Values mirror the tuned IsaacLab recipe in robot_lab
# (tasks/.../velocity/config/wheeled/rc + assets/rc_wheeled.py) wherever a
# UniLab owner term exists:
#   leg action order  FR, FL, RR, RL  (robot_lab LEG_JOINT_NAMES)
#   wheel action order FR, FL, RR, RL (robot_lab WHEEL_JOINT_NAMES)
#   hip scale 0.125, other leg joints 0.25, wheel velocity scale 5.0
#   sim_dt 0.005 / ctrl_dt 0.02, standing height 0.42 m
# Terms with no UniLab owner (contact sensors, torque/power/limits penalties,
# joint mirror/sync rewards) are intentionally omitted from this first port.
env:
  scene:
    model_file: src/unilab/assets/robots/rc27dog/scene_broken_bridge.xml
    default_keyframe_name: home
    entities:
      robot:
        root_body_name: base_link
        body_names: [base_link]
        # Deployment order: legs (FR, FL, RR, RL) then wheels (FR, FL, RR, RL).
        joint_names:
          - FR_hip_joint
          - FR_thigh_joint
          - FR_calf_joint
          - FL_hip_joint
          - FL_thigh_joint
          - FL_calf_joint
          - RR_hip_joint
          - RR_thigh_joint
          - RR_calf_joint
          - RL_hip_joint
          - RL_thigh_joint
          - RL_calf_joint
          - FR_feet_joint
          - FL_feet_joint
          - RR_feet_joint
          - RL_feet_joint
        actuator_names:
          - FR_hip_joint
          - FR_thigh_joint
          - FR_calf_joint
          - FL_hip_joint
          - FL_thigh_joint
          - FL_calf_joint
          - RR_hip_joint
          - RR_thigh_joint
          - RR_calf_joint
          - RL_hip_joint
          - RL_thigh_joint
          - RL_calf_joint
          - FR_feet_joint
          - FL_feet_joint
          - RR_feet_joint
          - RL_feet_joint
  sim_dt: 0.005
  ctrl_dt: 0.02
  max_episode_seconds: 20.0
  observations:
    # Policy observes no base linear velocity (robot_lab removes it); the critic
    # keeps it. Wheel joint positions are never observed: they are unbounded.
    policy:
      enable_corruption: true
      terms:
        base_ang_vel:
          func: unilab.envs.mdp.base_ang_vel
          scale: 0.25
        projected_gravity:
          func: unilab.envs.mdp.projected_gravity
        joint_pos:
          func: unilab.envs.mdp.joint_pos_rel
          params:
            asset_cfg:
              _target_: unilab.managers.SceneEntityCfg
              name: robot
              joint_names:
                - FR_hip_joint
                - FR_thigh_joint
                - FR_calf_joint
                - FL_hip_joint
                - FL_thigh_joint
                - FL_calf_joint
                - RR_hip_joint
                - RR_thigh_joint
                - RR_calf_joint
                - RL_hip_joint
                - RL_thigh_joint
                - RL_calf_joint
          noise:
            _target_: UniformNoiseCfg
            n_min: -0.01
            n_max: 0.01
        joint_vel:
          func: unilab.envs.mdp.joint_vel_rel
          scale: 0.05
          noise:
            _target_: UniformNoiseCfg
            n_min: -0.1
            n_max: 0.1
        actions:
          func: unilab.envs.mdp.last_action
        command:
          func: unilab.envs.mdp.generated_commands
          params: {command_name: twist}
    critic:
      terms:
        base_ang_vel:
          func: unilab.envs.mdp.base_ang_vel
          scale: 0.25
        projected_gravity:
          func: unilab.envs.mdp.projected_gravity
        base_lin_vel:
          func: unilab.envs.mdp.base_lin_vel
          scale: 2.0
        joint_pos:
          func: unilab.envs.mdp.joint_pos_rel
          params:
            asset_cfg:
              _target_: unilab.managers.SceneEntityCfg
              name: robot
              joint_names:
                - FR_hip_joint
                - FR_thigh_joint
                - FR_calf_joint
                - FL_hip_joint
                - FL_thigh_joint
                - FL_calf_joint
                - RR_hip_joint
                - RR_thigh_joint
                - RR_calf_joint
                - RL_hip_joint
                - RL_thigh_joint
                - RL_calf_joint
        joint_vel:
          func: unilab.envs.mdp.joint_vel_rel
          scale: 0.05
        actions:
          func: unilab.envs.mdp.last_action
        command:
          func: unilab.envs.mdp.generated_commands
          params: {command_name: twist}
  actions:
    # Term order defines the policy action layout: 12 legs then 4 wheels.
    leg_joint_pos:
      _target_: unilab.envs.mdp.JointPositionActionCfg
      entity_name: robot
      actuator_names:
        - FR_hip_joint
        - FR_thigh_joint
        - FR_calf_joint
        - FL_hip_joint
        - FL_thigh_joint
        - FL_calf_joint
        - RR_hip_joint
        - RR_thigh_joint
        - RR_calf_joint
        - RL_hip_joint
        - RL_thigh_joint
        - RL_calf_joint
      scale:
        ".*_hip_joint": 0.125
        "^(?!.*_hip_joint).*": 0.25
      clip: {".*": [-100.0, 100.0]}
      use_default_offset: true
      preserve_order: true
    wheel_vel:
      _target_: unilab.envs.mdp.JointVelocityActionCfg
      entity_name: robot
      actuator_names:
        - FR_feet_joint
        - FL_feet_joint
        - RR_feet_joint
        - RL_feet_joint
      scale: 5.0
      # WHEEL_MAX_VELOCITY = 587 rpm -> 61.4705 rad/s
      clip: {".*": [-61.470496255240, 61.470496255240]}
      use_default_offset: false
      preserve_order: true
  commands:
    twist:
      _target_: unilab.tasks.locomotion.rc27dog.manager_terms.BrokenBridgeVelocityCommandCfg
      entity_name: robot
      resampling_time_range: [5.0, 15.0]
      heading_command: false
      heading_control_stiffness: 0.5
      rel_standing_envs: 0.05
      rel_heading_envs: 0.0
      rel_world_envs: 0.0
      forward_only_prob: 0.70
      turn_in_place_prob: 0.25
      standing_prob: 0.05
      min_turn_abs_ang_vel_z: 0.2
      ranges:
        lin_vel_x: [0.25, 0.65]
        lin_vel_y: [0.0, 0.0]
        ang_vel_z: [-0.5, 0.5]
        heading: null
  events:
    reset_scene_to_default:
      func: unilab.envs.mdp.reset_scene_to_default
      mode: reset
    reset_root_state_uniform:
      func: unilab.envs.mdp.reset_root_state_uniform
      mode: reset
      params:
        pose_range:
          x: [-0.5, 0.5]
          y: [-0.5, 0.5]
          z: [0.0, 0.06]
          roll: [-0.15, 0.15]
          pitch: [-0.15, 0.15]
          yaw: [-3.141592653589793, 3.141592653589793]
        velocity_range:
          x: [-0.5, 0.5]
          y: [-0.5, 0.5]
          z: [-0.2, 0.2]
          roll: [-0.25, 0.25]
          pitch: [-0.25, 0.25]
          yaw: [-0.5, 0.5]
    pd_gains:
      # Legs only: the wheel actuators are velocity servos with no kp.
      func: unilab.envs.mdp.pd_gains
      mode: reset
      params:
        kp_range: [0.9, 1.1]
        kd_range: [0.9, 1.1]
        operation: scale
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          actuator_names:
            - FR_hip_joint
            - FR_thigh_joint
            - FR_calf_joint
            - FL_hip_joint
            - FL_thigh_joint
            - FL_calf_joint
            - RR_hip_joint
            - RR_thigh_joint
            - RR_calf_joint
            - RL_hip_joint
            - RL_thigh_joint
            - RL_calf_joint
  terminations:
    time_out:
      func: unilab.envs.mdp.time_out
      time_out: true
    bad_orientation:
      func: unilab.envs.mdp.bad_orientation
      params:
        limit_angle: 1.0471975511965976
    base_height:
      func: unilab.envs.mdp.root_height_below_minimum
      params:
        minimum_height: 0.15
  policy_observation_group: policy
  critic_observation_group: critic

reward:
  track_lin_vel:
    func: unilab.envs.mdp.track_linear_velocity
    weight: 5.0
    params: {std: 0.5, command_name: twist}
  track_ang_vel:
    func: unilab.envs.mdp.track_angular_velocity
    weight: 3.0
    params: {std: 0.5, command_name: twist}
  terminated:
    func: unilab.envs.mdp.is_terminated
    weight: -100.0
  ang_vel_xy:
    func: unilab.envs.mdp.body_angular_velocity_penalty
    weight: -0.8
  flat_orientation:
    func: unilab.envs.mdp.flat_orientation_l2
    weight: -0.1
  base_height:
    func: unilab.tasks.locomotion.common.manager_terms.base_height_l2
    weight: -15.0
    params:
      target_height: 0.42
  joint_pos_limits:
    func: unilab.envs.mdp.joint_pos_limits
    weight: -5.0
    params:
      asset_cfg:
        _target_: unilab.managers.SceneEntityCfg
        name: robot
        joint_names:
          - FR_hip_joint
          - FR_thigh_joint
          - FR_calf_joint
          - FL_hip_joint
          - FL_thigh_joint
          - FL_calf_joint
          - RR_hip_joint
          - RR_thigh_joint
          - RR_calf_joint
          - RL_hip_joint
          - RL_thigh_joint
          - RL_calf_joint
  action_rate:
    func: unilab.envs.mdp.action_rate_l2
    weight: -0.01
  progress:
    func: unilab.tasks.locomotion.rc27dog.manager_terms.ObstacleReward
    weight: 2.0
    params:
      kind: broken_bridge_progress
      start_x: -0.2
      finish_x: 3.5

# @package _global_
# FlashSAC MuJoCo owner: CPU-authoritative physics (mjbatch) with the CUDA
# learner. This is the first-run / asset-debug owner: MuJoCo gives the clearest
# MJCF diagnostics before switching the same task to the mjwarp owner.
defaults:
  - /task/rc27dog_flat/base
  - _self_

training:
  task_name: RC27DogWheelFlat
  sim_backend: mujoco
algo:
  num_envs: 2048
  batch_size: 4096
  learning_starts: 98
  max_iterations: 5000
  save_interval: 1000
  updates_per_step: 4
  replay_buffer_n: 256
  tau: 0.05

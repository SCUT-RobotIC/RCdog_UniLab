# @package _global_
# FlashSAC MJWarp owner: device-resident GPU physics plus the CUDA learner.
# MJWarp needs the fused selected-row reset path and cannot negotiate scene
# resets or actuator-gain randomization, so those terms are overridden here
# (same shape as conf/flashsac/task/g1_walk_flat/mjwarp.yaml).
defaults:
  - /task/rc27dog_flat/base
  - _self_

training:
  task_name: RC27DogWheelFlat
  sim_backend: mjwarp
  # MJWarp has no native renderer; offline playback reuses the MuJoCo visual
  # model through the task owner.
  play_render_mode: record
algo:
  num_envs: 4096
  batch_size: 4096
  learning_starts: 49
  max_iterations: 5000
  save_interval: 1000
  updates_per_step: 8
  replay_buffer_n: 256
  tau: 0.05
env:
  # Contact / constraint budget for 4 wheel contacts per env plus leg contacts.
  mjwarp_nconmax: 128
  mjwarp_njmax: 256
  events:
    reset_scene_to_default:
      func: unilab.envs.mdp.skip_scene_reset
    reset_root_state_uniform:
      func: unilab.envs.mdp.reset_root_state_uniform_fused
    pd_gains: null

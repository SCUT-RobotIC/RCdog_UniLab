# @package _global_
# RC27Dog stone-road owner.  The generator is kept in the task package so the
# terrain recipe remains cold-path and independently testable.
defaults:
  - /task/rc27dog_flat/base
  - _self_

env:
  scene:
    model_file: src/unilab/assets/robots/rc27dog/rc27dog.xml
    terrain:
      _target_: unilab.base.scene.TerrainSceneCfg
      generator:
        _target_: unilab.tasks.locomotion.rc27dog.terrains.Rc27DogRoughStonesTerrainCfg
      geom_name: floor
  max_episode_seconds: 20.0

